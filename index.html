<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(255, 255, 161);
        }
        h1{
            text-align: center;
            color: rgb(133, 133, 53);
            font-family: monospace;
            font-size: 40px;
        }
        label{
            position: relative;
            font-size: 25px;
            text-align: center;
            font-family: sans-serif;
            color: rgb(133, 133, 53);
            left: 500px;
            margin-top: 30px;
        }
        input{
            display: block;
            position: relative;
            text-align: center;
            margin-bottom:40px;
            font-size: 20px;
            padding: 20px;
            background-color: rgb(133, 133, 53) ;
            border: 1px solid rgb(133, 133, 53);
            border-radius: 30px;
            color: rgb(255, 255, 161);
            left: 500px;

        }
        button{
            display: inline-block;
            position: relative;
            background-color: rgb(133, 133, 53);
            font-size: 30px;
            color: rgb(255, 255, 161);
            border: 1px solid rgb(133, 133, 53);
            border-radius: 50px;
            padding: 20px;
            left: 460px;
        }
        button:hover{
            background-color: rgb(255, 255, 161);
            color: rgb(133, 133, 53);
            border: 3px solid rgb(133, 133, 53);
        }
        #display{
            position: relative;
            background-color: rgb(133, 133, 53);
            margin-top: 30px;
            padding:20px;
            text-align: center;
            width: 300px;
            font-family: sans-serif;
            color: rgb(255, 255, 161);
            font-size: 30px;
            border-radius: 50px;
            left: 470px;
        }
    </style>
</head>
<body>
    <h1>Cinema Ticket Booking</h1>
    <label for="name" >Name:</label> <input id="name" type="text">
    <label for="age" >Age:</label> <input id="age" type="text">
    <label for="numberoftickets" >Number of tickets:</label> <input id="numberoftickets" type="text">
    <button id="calcprix">Calculate Price</button>
    <button id="clear">Clear</button>
    <div id="display"></div>
    <script>
        let ticket=0;
        function calculateticket(age){
            if (age<12){
                ticket=5;
            }
            if (age>=12 && age<=17){
                ticket=7;
            }
            if (age>=18){
                ticket=10;
            }
        }
        document.getElementById('calcprix').addEventListener("click",function(){
            const age=Number(document.getElementById('age').value);
            calculateticket(age)
            document.getElementById('display').innerHTML= document.getElementById('name').value + "'s Ticket <br>";
            document.getElementById('display').innerHTML+='Price per tickets: ' + ticket + '$ <br>';
            document.getElementById('display').innerHTML+='Number of tickets: '+ document.getElementById('numberoftickets').value + '<br>';
            document.getElementById('display').innerHTML+= "Total: " + ticket * Number(document.getElementById('numberoftickets').value) + '$ <br>';
        })
        document.getElementById('clear').addEventListener("click",function(){
            document.getElementById('name').value='';
            document.getElementById('age').value='';
            document.getElementById('numberoftickets').value='';
            document.getElementById('display').innerHTML='';
        })

    </script>
</body>
</html>
